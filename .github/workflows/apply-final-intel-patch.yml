name: Apply final intelligence farm patch

on:
  push:
    branches:
      - agent/stay-current-bn-intel-farm

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: python3 .github/patch.py
      - run: |
          node --check autopilot.js
          node --check work-for-faction2.js
          node --check farm-intel.js
          node --check intel-farm.js
          node --check utils.js
          node --check git-pull.js
          git diff --check
      - run: |
          rm .github/patch.py
          rm .github/workflows/apply-final-intel-patch.yml
          rm .github/workflows/materialize-intel-autopilot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize same-BitNode intelligence farming"
          git push origin HEAD:${GITHUB_REF_NAME}
