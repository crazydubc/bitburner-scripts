name: Apply final current-BitNode intelligence farm refinements

on:
  push:
    branches:
      - agent/stay-current-bn-intel-farm

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Apply validated refinements
        shell: bash
        run: |
          cat > /tmp/intel-refinements.patch.gz.b64 <<'PATCH'
          
          PATCH
          tr -d '[:space:]' < /tmp/intel-refinements.patch.gz.b64 | base64 -d | gzip -d > /tmp/intel-refinements.patch
          git apply --check /tmp/intel-refinements.patch
          git apply /tmp/intel-refinements.patch

      - name: Validate source and state contracts
        shell: bash
        run: |
          git diff --check
          node --check autopilot.js
          node --check work-for-faction2.js
          node --check farm-intel.js
          node --check intel-farm.js
          node --check utils.js
          node --check git-pull.js

          grep -q -- '--cashroot-only' autopilot.js
          grep -q 'prepareCashRoot' work-for-faction2.js
          grep -q 'purchaseAugmentation", "Sector-12", CASHROOT_AUG' autopilot.js
          grep -q 'softReset", "farm-intel.js"' autopilot.js
          grep -q 'INTEL_FARM_TARGET' farm-intel.js
          grep -q 'intelFarmPreparation' work-for-faction2.js
          ! grep -q 'bitflume(ns, 8' autopilot.js
          ! grep -q 'resetInfo.currentNode != 8' autopilot.js

          python3 - <<'PY'
          from pathlib import Path
          autopilot = Path('autopilot.js').read_text()
          worker = Path('work-for-faction2.js').read_text()
          farm = Path('farm-intel.js').read_text()
          assert autopilot.index('const intelFarmAction = await manageIntelFarm(ns);') < \
                 autopilot.index('await checkOnDaedalusStatus(ns, player, stocksValue);')
          assert worker.index('if (cashRootOnly) return await prepareCashRoot();') < \
                 worker.index('isBladeburnerInterruption()')
          assert 'if (!preparingIntelFarm) await maybeInstallAugmentations(ns, player);' in autopilot
          assert 'intelligence >= INTEL_FARM_TARGET' in farm
          assert 'The BitNode will not change.' in autopilot
          PY

          cp intel-farm.js /tmp/intel-farm.mjs
          node --input-type=module <<'NODE'
          import {
            CORPORATE_FACTIONS, getMissingCorporateFactions, isIntelFarmComplete,
            readIntelFarmState, writeIntelFarmState
          } from 'file:///tmp/intel-farm.mjs';
          if (CORPORATE_FACTIONS.length !== 10) throw new Error('Expected all ten corporate factions');
          const missing = getMissingCorporateFactions(CORPORATE_FACTIONS.slice(0, 4), CORPORATE_FACTIONS.slice(4, 9));
          if (missing.length !== 1 || missing[0] !== CORPORATE_FACTIONS[9])
            throw new Error(`Corporate access calculation failed: ${JSON.stringify(missing)}`);
          let stored = '';
          const ns = {read: () => stored, write: (_file, value) => {stored = value; return true;}};
          if (readIntelFarmState(ns).phase !== 'pending') throw new Error('Missing state should be pending');
          const state = writeIntelFarmState(ns, {phase: 'complete', completedIntelligence: 137});
          if (!isIntelFarmComplete(state, 137)) throw new Error('Completion marker should match current save');
          if (isIntelFarmComplete(state, 100)) throw new Error('Stale high-intelligence marker should not suppress farming');
          NODE

      - name: Commit final runtime files
        shell: bash
        run: |
          rm .github/workflows/materialize-intel-autopilot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autopilot.js work-for-faction2.js farm-intel.js .github/workflows/materialize-intel-autopilot.yml
          git diff --cached --check
          git commit -m "Harden current-BitNode intelligence farming"
          git push origin HEAD:${GITHUB_REF_NAME}
