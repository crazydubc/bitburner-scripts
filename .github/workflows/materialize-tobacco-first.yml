name: Materialize Tobacco-first corporation strategy

on:
  push:
    branches:
      - agent/stage-corporation-tobacco-first

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Materialize the validated runtime files on current main
        shell: bash
        run: |
          git fetch origin agent/use-free-api-corp-fast-path
          git show origin/agent/use-free-api-corp-fast-path:corporation.js > corporation.js
          git show origin/agent/use-free-api-corp-fast-path:tests/corporation-bootstrap-capital.test.mjs \
            > tests/corporation-bootstrap-capital.test.mjs
          git show origin/agent/use-free-api-corp-fast-path:tests/corporation-tobacco-round-two.test.mjs \
            > tests/corporation-tobacco-round-two.test.mjs

          # Preserve the corporation logging cleanup that landed on main after PR #29 was opened.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('corporation.js')
          text = path.read_text()

          def remove_function(source, name):
              marker = f'function {name}('
              marker_pos = source.find(marker)
              if marker_pos < 0:
                  return source
              start = source.rfind('\n', 0, marker_pos) + 1
              brace = source.find('{', marker_pos)
              depth = 0
              quote = None
              escaped = False
              for index in range(brace, len(source)):
                  char = source[index]
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in "'\"`":
                      quote = char
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          while end < len(source) and source[end] in ' \t':
                              end += 1
                          if end < len(source) and source[end] == '\n':
                              end += 1
                          return source[:start] + source[end:]
              raise RuntimeError(f'Unterminated function {name}')

          def remove_call_statements(source, callee):
              marker = f'{callee}('
              while marker in source:
                  marker_pos = source.index(marker)
                  start = source.rfind('\n', 0, marker_pos) + 1
                  open_paren = source.index('(', marker_pos)
                  depth = 0
                  quote = None
                  escaped = False
                  end = None
                  for index in range(open_paren, len(source)):
                      char = source[index]
                      if quote:
                          if escaped:
                              escaped = False
                          elif char == '\\':
                              escaped = True
                          elif char == quote:
                              quote = None
                          continue
                      if char in "'\"`":
                          quote = char
                      elif char == '(':
                          depth += 1
                      elif char == ')':
                          depth -= 1
                          if depth == 0:
                              end = index + 1
                              break
                  if end is None:
                      raise RuntimeError(f'Unterminated call to {callee}')
                  while end < len(source) and source[end] in ' \t;':
                      end += 1
                  if end < len(source) and source[end] == '\n':
                      end += 1
                  source = source[:start] + source[end:]
              return source

          text = remove_function(text, 'logBootstrapWarning')
          text = remove_call_statements(text, 'logBootstrapWarning')
          text = text.replace('        const required = combinedCost + reserve\n', '')
          text = text.replace(
              "  log(ns, `Accepted round ${round} investment offer for ${ns.format.number(offerFunds, 3)}. ` +\n"
              "    `Off to round ${resolvedNextRound}!`, true, 'success', 20)\n",
              '')
          if 'logBootstrapWarning' in text:
              raise RuntimeError('stale logBootstrapWarning reference remains')
          path.write_text(text)

          test_path = Path('tests/corporation-bootstrap-capital.test.mjs')
          test = test_path.read_text().replace(
              'assert.match(source, /Stopped boost-material purchases and liquidating them at market price/)\n',
              '')
          test_path.write_text(test)
          PY

      - name: Validate source and regressions
        shell: bash
        run: |
          node --check corporation.js
          for test in tests/*.test.mjs; do node "$test"; done
          git diff --check

      - name: Commit clean runtime tree
        shell: bash
        run: |
          rm .github/workflows/materialize-tobacco-first.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prioritize the Tobacco product engine after round one"
          git push origin HEAD:${GITHUB_REF_NAME}
