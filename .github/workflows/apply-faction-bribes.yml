name: Apply post-round faction bribes

on:
  push:
    branches:
      - agent/bribe-active-factions-after-round-5

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Add active-faction bribes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('corporation.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { getReset, log, corpRun, getBNMults } from './utils.js'\n",
              "import { getReset, log, corpRun, getBNMults, singRun, getPlayerInfo, getOwnedAugs } from './utils.js'\n"
              "import {\n"
              "  DEFAULT_DESIRED_AUGS, DEFAULT_PRIORITY_AUGS, NEUROFLUX,\n"
              "  buildDesiredAugSet, getDefaultDesiredStats\n"
              "} from './faction-route-planner.js'\n",
              'extend imports')

          replace_once(
              "const ROUND_ONE_OPERATING_RESERVE = 5e9\n"
              "const ROUND_ONE_EXPANSION_RESERVE = 1e9\n",
              "const ROUND_ONE_OPERATING_RESERVE = 5e9\n"
              "const ROUND_ONE_EXPANSION_RESERVE = 1e9\n"
              "const POST_ROUND_BRIBE_MIN_RESERVE = 1e18\n"
              "const POST_ROUND_BRIBE_RESERVE_RATIO = 0.5\n"
              "const POST_ROUND_BRIBE_MAX_SPEND_RATIO = 0.05\n"
              "const POST_ROUND_BRIBE_OPERATING_RESERVE_SECONDS = 10 * 60\n"
              "const POST_ROUND_BRIBE_STATUS_INTERVAL = 30_000\n"
              "const factionAugMetadataDB = Object.create(null)\n"
              "let lastFactionBribeStatus = ''\n"
              "let lastFactionBribeStatusAt = 0\n",
              'add bribe policy constants')

          pure_helpers = r'''
          /** Preserve growth capital before treating corporation funds as excess. */
          export function getFactionBribeReserve(
            corporationFunds,
            corporationExpenses = 0,
            minimumReserve = POST_ROUND_BRIBE_MIN_RESERVE,
            reserveRatio = POST_ROUND_BRIBE_RESERVE_RATIO,
            operatingReserveSeconds = POST_ROUND_BRIBE_OPERATING_RESERVE_SECONDS,
          ) {
            const funds = Math.max(0, Number(corporationFunds) || 0)
            const expenses = Math.max(0, Number(corporationExpenses) || 0)
            return Math.max(
              Math.max(0, Number(minimumReserve) || 0),
              funds * Math.max(0, Number(reserveRatio) || 0),
              expenses * Math.max(0, Number(operatingReserveSeconds) || 0),
            )
          }

          /** Limit each bribe to the exact reputation gap and a bounded share of excess funds. */
          export function calculateFactionBribeAmount({
            corporationFunds,
            corporationValuation,
            corporationExpenses = 0,
            currentRep,
            targetRep,
            bribeThreshold,
            bribeAmountPerReputation,
            minimumReserve = POST_ROUND_BRIBE_MIN_RESERVE,
            reserveRatio = POST_ROUND_BRIBE_RESERVE_RATIO,
            maxSpendRatio = POST_ROUND_BRIBE_MAX_SPEND_RATIO,
            operatingReserveSeconds = POST_ROUND_BRIBE_OPERATING_RESERVE_SECONDS,
          }) {
            const funds = Number(corporationFunds)
            const valuation = Number(corporationValuation)
            const threshold = Number(bribeThreshold)
            const costPerRep = Number(bribeAmountPerReputation)
            const current = Number(currentRep)
            const target = Number(targetRep)
            if (!Number.isFinite(funds) || funds <= 0 || !Number.isFinite(valuation) ||
              !Number.isFinite(threshold) || valuation < threshold || !Number.isFinite(costPerRep) ||
              costPerRep <= 0 || !Number.isFinite(current) || !Number.isFinite(target) || target <= current)
              return 0

            const reserve = getFactionBribeReserve(
              funds,
              corporationExpenses,
              minimumReserve,
              reserveRatio,
              operatingReserveSeconds,
            )
            const available = Math.max(0, funds - reserve)
            const required = Math.ceil((target - current) * costPerRep)
            const perCycleCap = Math.max(0, funds * Math.max(0, Number(maxSpendRatio) || 0))
            const amount = Math.floor(Math.min(required, available, perCycleCap))
            return Number.isSafeInteger(amount) || amount <= Number.MAX_SAFE_INTEGER ? Math.max(0, amount) : 0
          }

          /** Select the next desired augmentation threshold that can be satisfied through this faction. */
          export function selectFactionBribeTarget({
            augmentationNames = [],
            desiredAugSet = new Set(),
            ownedAugs = [],
            currentRep = 0,
            augRepReqs = {},
            augPrereqs = {},
          }) {
            const desired = desiredAugSet instanceof Set ? desiredAugSet : new Set(desiredAugSet ?? [])
            const owned = new Set(ownedAugs ?? [])
            const offered = new Set(augmentationNames ?? [])
            const current = Number(currentRep) || 0
            const requirement = aug => {
              const value = Number(augRepReqs?.[aug])
              return Number.isFinite(value) ? value : Infinity
            }
            const reachableAt = (aug, targetRep, visiting = new Set()) => {
              if (owned.has(aug)) return true
              if (visiting.has(aug)) return false
              visiting.add(aug)
              for (const prereq of augPrereqs?.[aug] ?? []) {
                if (owned.has(prereq)) continue
                if (!offered.has(prereq) || requirement(prereq) > targetRep ||
                  !reachableAt(prereq, targetRep, visiting)) {
                  visiting.delete(aug)
                  return false
                }
              }
              visiting.delete(aug)
              return true
            }

            const candidates = [...offered].filter(aug => aug !== NEUROFLUX && desired.has(aug) &&
              !owned.has(aug) && requirement(aug) > current)
            const thresholds = [...new Set(candidates.map(requirement))]
              .filter(Number.isFinite)
              .sort((a, b) => a - b)
            for (const targetRep of thresholds) {
              const unlockedAugs = candidates
                .filter(aug => requirement(aug) <= targetRep && reachableAt(aug, targetRep))
                .sort((a, b) => requirement(a) - requirement(b) || a.localeCompare(b))
              if (unlockedAugs.length > 0) return { targetRep, unlockedAugs }
            }
            return null
          }

          '''
          pure_helpers = '\n'.join(line[10:] if line.startswith('          ') else line for line in pure_helpers.splitlines())
          replace_once(
              'function logBootstrapWarning(ns, message) {\n',
              pure_helpers + 'function logBootstrapWarning(ns, message) {\n',
              'insert pure bribe helpers')

          runtime_helpers = r'''
          function isApiError(value) {
            return typeof value === 'string' && value.startsWith('ERROR:')
          }

          function logFactionBribeStatus(ns, signature, message, style = 'info') {
            const now = Date.now()
            if (signature === lastFactionBribeStatus &&
              now - lastFactionBribeStatusAt < POST_ROUND_BRIBE_STATUS_INTERVAL) return
            lastFactionBribeStatus = signature
            lastFactionBribeStatusAt = now
            log(ns, message, true, style)
          }

          async function getFactionAugMetadata(ns, faction) {
            const augmentationNames = await singRun(ns, 'getAugmentationsFromFaction', faction)
            if (isApiError(augmentationNames) || !Array.isArray(augmentationNames)) return null
            const key = augmentationNames.slice().sort().join('|')
            if (factionAugMetadataDB[faction]?.key === key) return factionAugMetadataDB[faction]

            const augRepReqs = {}
            const augStats = {}
            const augPrereqs = {}
            for (const aug of augmentationNames) {
              const repRequirement = await singRun(ns, 'getAugmentationRepReq', aug)
              const stats = await singRun(ns, 'getAugmentationStats', aug)
              const prereqs = await singRun(ns, 'getAugmentationPrereq', aug)
              if (isApiError(repRequirement) || isApiError(stats) || isApiError(prereqs)) return null
              const rep = Number(repRequirement)
              augRepReqs[aug] = Number.isFinite(rep) ? rep : Infinity
              augStats[aug] = stats && typeof stats === 'object' && !Array.isArray(stats) ? stats : {}
              augPrereqs[aug] = Array.isArray(prereqs) ? prereqs : []
            }

            return factionAugMetadataDB[faction] = {
              key,
              augmentationNames,
              augRepReqs,
              augStats,
              augPrereqs,
            }
          }

          /** Use only post-investment excess funds to finish the active faction's next desired augmentation threshold. */
          async function manageFactionBribes(ns, resetInfo) {
            const work = await singRun(ns, 'getCurrentWork')
            if (!work || typeof work !== 'object' || Array.isArray(work) ||
              work.type !== 'FACTION' || !work.factionName) return false

            const faction = work.factionName
            const corporation = await getCorp(ns)
            const constants = await getCorporationConstants(ns)
            if (!corporation || !constants) return false

            const valuation = Number(corporation.valuation)
            const bribeThreshold = Number(constants.bribeThreshold)
            const costPerRep = Number(constants.bribeAmountPerReputation)
            if (!Number.isFinite(valuation) || !Number.isFinite(bribeThreshold) ||
              !Number.isFinite(costPerRep) || costPerRep <= 0) return false
            if (valuation < bribeThreshold) {
              logFactionBribeStatus(ns, `valuation:${faction}`,
                `Corporation bribes are waiting for valuation ${ns.format.number(valuation, 3)}/` +
                `${ns.format.number(bribeThreshold, 3)}.`, 'info')
              return false
            }

            const playerInfo = await getPlayerInfo(ns)
            const ownedAugs = await getOwnedAugs(ns, true)
            if (!playerInfo || !Array.isArray(playerInfo.factions) ||
              !playerInfo.factions.includes(faction) || !Array.isArray(ownedAugs)) return false

            const metadata = await getFactionAugMetadata(ns, faction)
            if (!metadata) {
              logFactionBribeStatus(ns, `metadata:${faction}`,
                `Unable to load augmentation metadata for corporation bribes to ${faction}.`, 'warning')
              return false
            }

            const currentRepResult = await singRun(ns, 'getFactionRep', faction)
            if (isApiError(currentRepResult)) return false
            const currentRep = Number(currentRepResult)
            if (!Number.isFinite(currentRep)) return false

            const desiredStats = getDefaultDesiredStats({
              bitNode: resetInfo.currentNode,
              ownedAugCount: ownedAugs.length,
              factions: playerInfo.factions,
              lastAugReset: resetInfo.lastAugReset,
            })
            const desiredAugSet = buildDesiredAugSet({
              augmentationNames: metadata.augmentationNames,
              augStats: metadata.augStats,
              augPrereqs: metadata.augPrereqs,
              ownedAugs,
              desiredStats,
              desiredAugs: DEFAULT_DESIRED_AUGS,
              priorityAugs: DEFAULT_PRIORITY_AUGS,
            })
            const target = selectFactionBribeTarget({
              augmentationNames: metadata.augmentationNames,
              desiredAugSet,
              ownedAugs,
              currentRep,
              augRepReqs: metadata.augRepReqs,
              augPrereqs: metadata.augPrereqs,
            })
            if (!target) return false

            const amount = calculateFactionBribeAmount({
              corporationFunds: corporation.funds,
              corporationValuation: valuation,
              corporationExpenses: corporation.expenses,
              currentRep,
              targetRep: target.targetRep,
              bribeThreshold,
              bribeAmountPerReputation: costPerRep,
            })
            if (!(amount > 0)) {
              const reserve = getFactionBribeReserve(corporation.funds, corporation.expenses)
              logFactionBribeStatus(ns, `reserve:${faction}:${target.targetRep}`,
                `Holding corporation growth reserve ${ns.format.number(reserve, 3)} before bribing ${faction} ` +
                `toward [${target.unlockedAugs.join(', ')}].`, 'info')
              return false
            }

            if (await corpRun(ns, 'bribe', faction, amount) !== true) {
              logFactionBribeStatus(ns, `failed:${faction}:${target.targetRep}`,
                `Corporation failed to bribe ${faction} with ${ns.format.number(amount, 3)}; retrying later.`,
                'warning')
              return false
            }

            const reputationGain = amount / costPerRep
            lastFactionBribeStatus = ''
            log(ns, `Bribed ${faction} with $${ns.format.number(amount, 3)} for approximately ` +
              `${ns.format.number(reputationGain, 3)} reputation toward ` +
              `[${target.unlockedAugs.join(', ')}] (target ${Math.ceil(target.targetRep).toLocaleString()} rep).`,
              true, 'success')
            return true
          }

          '''
          runtime_helpers = '\n'.join(line[10:] if line.startswith('          ') else line for line in runtime_helpers.splitlines())
          replace_once(
              '/** @param {NS} ns */\nexport async function main(ns) {\n',
              runtime_helpers + '/** @param {NS} ns */\nexport async function main(ns) {\n',
              'insert runtime bribe manager')

          replace_once(
              '  const myBN = (await getReset(ns)).currentNode;\n',
              '  const resetInfo = await getReset(ns)\n  const myBN = resetInfo.currentNode;\n',
              'retain reset info for desired augmentation policy')

          replace_once(
              '      if (nState === "START") {\n'
              '        await manageOffice(ns)\n'
              '        teaNeeded = await teaParty(ns)\n'
              '      }\n'
              '      if (nState === "EXPORT") {\n',
              '      if (nState === "START") {\n'
              '        await manageOffice(ns)\n'
              '        teaNeeded = await teaParty(ns)\n'
              '        await manageFactionBribes(ns, resetInfo)\n'
              '      }\n'
              '      if (nState === "EXPORT") {\n',
              'add bribe pass after round-five operations')

          path.write_text(text)
          PY

          cat > tests/corporation-faction-bribes.test.mjs <<'TEST'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'

          const source = fs.readFileSync(new URL('../corporation.js', import.meta.url), 'utf8')

          function extractFunction(name) {
            const marker = `export function ${name}`
            const start = source.indexOf(marker)
            assert.notEqual(start, -1, `${name} should be exported`)
            const open = source.indexOf('{', start)
            let depth = 0
            for (let index = open; index < source.length; index++) {
              if (source[index] === '{') depth++
              if (source[index] === '}') {
                depth--
                if (depth === 0) return source.slice(start, index + 1)
              }
            }
            throw new Error(`Unable to extract ${name}`)
          }

          const constants = [
            'const NEUROFLUX = "NeuroFlux Governor"',
            source.match(/const POST_ROUND_BRIBE_MIN_RESERVE = [^\n]+/)?.[0],
            source.match(/const POST_ROUND_BRIBE_RESERVE_RATIO = [^\n]+/)?.[0],
            source.match(/const POST_ROUND_BRIBE_MAX_SPEND_RATIO = [^\n]+/)?.[0],
            source.match(/const POST_ROUND_BRIBE_OPERATING_RESERVE_SECONDS = [^\n]+/)?.[0],
          ].join('\n')
          assert.doesNotMatch(constants, /undefined/)
          const moduleSource = [
            constants,
            extractFunction('getFactionBribeReserve'),
            extractFunction('calculateFactionBribeAmount'),
            extractFunction('selectFactionBribeTarget'),
          ].join('\n')
          const strategy = await import(`data:text/javascript;base64,${Buffer.from(moduleSource).toString('base64')}`)

          assert.equal(strategy.getFactionBribeReserve(500e18, 1e15), 250e18)
          assert.equal(strategy.getFactionBribeReserve(1e18, 0), 1e18)

          assert.equal(strategy.calculateFactionBribeAmount({
            corporationFunds: 500e18,
            corporationValuation: 200e12,
            corporationExpenses: 1e15,
            currentRep: 0,
            targetRep: 1e6,
            bribeThreshold: 100e12,
            bribeAmountPerReputation: 1e9,
          }), 1e15)
          assert.equal(strategy.calculateFactionBribeAmount({
            corporationFunds: 500e18,
            corporationValuation: 99e12,
            currentRep: 0,
            targetRep: 1e6,
            bribeThreshold: 100e12,
            bribeAmountPerReputation: 1e9,
          }), 0)
          assert.equal(strategy.calculateFactionBribeAmount({
            corporationFunds: 1e18,
            corporationValuation: 200e12,
            currentRep: 0,
            targetRep: 1e6,
            bribeThreshold: 100e12,
            bribeAmountPerReputation: 1e9,
          }), 0)
          assert.equal(strategy.calculateFactionBribeAmount({
            corporationFunds: 2e18,
            corporationValuation: 200e12,
            currentRep: 0,
            targetRep: 1e9,
            bribeThreshold: 100e12,
            bribeAmountPerReputation: 1e9,
          }), 1e17)

          const desired = new Set(['Starter', 'Prereq', 'High', 'Blocked'])
          const baseTargetArgs = {
            augmentationNames: ['NeuroFlux Governor', 'Starter', 'Prereq', 'High', 'Blocked'],
            desiredAugSet: desired,
            ownedAugs: [],
            augRepReqs: {
              'NeuroFlux Governor': 1,
              Starter: 2_000,
              Blocked: 2_500,
              Prereq: 3_000,
              High: 5_000,
              Missing: 1_000,
            },
            augPrereqs: {
              High: ['Prereq'],
              Blocked: ['Missing'],
            },
          }
          assert.deepEqual(strategy.selectFactionBribeTarget({...baseTargetArgs, currentRep: 1_000}), {
            targetRep: 2_000,
            unlockedAugs: ['Starter'],
          })
          assert.deepEqual(strategy.selectFactionBribeTarget({...baseTargetArgs, currentRep: 2_500}), {
            targetRep: 3_000,
            unlockedAugs: ['Prereq'],
          })
          assert.deepEqual(strategy.selectFactionBribeTarget({...baseTargetArgs, currentRep: 3_000}), {
            targetRep: 5_000,
            unlockedAugs: ['High'],
          })
          assert.equal(strategy.selectFactionBribeTarget({
            ...baseTargetArgs,
            currentRep: 5_000,
            ownedAugs: ['Starter', 'Prereq', 'High'],
          }), null)

          const roundFive = source.indexOf('while (round >= 5)')
          const bribeCall = source.indexOf('await manageFactionBribes(ns, resetInfo)', roundFive)
          const teaParty = source.indexOf('teaNeeded = await teaParty(ns)', roundFive)
          assert.ok(roundFive >= 0 && teaParty > roundFive && bribeCall > teaParty,
            'post-round bribes should run after office and morale upkeep')
          assert.match(source, /corpRun\(ns, 'bribe', faction, amount\)/)
          assert.match(source, /work\.type !== 'FACTION'/)
          assert.match(source, /buildDesiredAugSet/)
          assert.match(source, /getDefaultDesiredStats/)

          console.log('corporation active-faction bribe regression checks passed')
          TEST

      - name: Validate source and regressions
        shell: bash
        run: |
          node --check corporation.js
          node tests/corporation-bootstrap-capital.test.mjs
          node tests/corporation-investment-multipliers.test.mjs
          node tests/corporation-faction-bribes.test.mjs
          git diff --check

      - name: Commit runtime changes
        shell: bash
        run: |
          rm .github/workflows/apply-faction-bribes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- corporation.js tests/corporation-faction-bribes.test.mjs .github/workflows/apply-faction-bribes.yml
          git diff --cached --check
          git commit -m "Bribe active factions with post-round corporation funds"
          git push origin HEAD:${GITHUB_REF_NAME}
