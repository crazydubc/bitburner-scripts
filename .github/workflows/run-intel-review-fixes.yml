name: Run intelligence farm review fixes

on:
  push:
    branches:
      - agent/stay-current-bn-intel-farm

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Apply fixes
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/review.py
          python3 /tmp/review.py
      - name: Validate
        run: |
          node --check autopilot.js
          node --check farm-intel.js
          node --check work-for-faction2.js
          grep -q 'stopForLowROI ||=' farm-intel.js
          grep -q "ns.spawn('autopilot.js'" farm-intel.js
          git diff --check
      - name: Commit
        run: |
          rm -f .github/review.py
          rm -f .github/workflows/apply-intel-review-fixes.yml
          rm -f .github/workflows/run-intel-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden same-BitNode intelligence farming'
          git push origin HEAD:${GITHUB_REF_NAME}
